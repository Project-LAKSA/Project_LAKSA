joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.10
    autorepeat_rate: 20.0
    sticky_buttons: false

xbox_drive_node:
  ros__parameters:
    steering_axis: 2
    steering_scale_rad: -0.35
    trigger_axis: 5
    trigger_pressed_threshold: -0.50
    trigger_released_threshold: -0.10
    # 0.6731984 m/s converts back to 900 eRPM with the current ESP32
    # calibration: 7 pole pairs, 1:1 reduction and 100 mm wheel diameter.
    pressed_speed_mps: 0.6731984
    publish_rate_hz: 20.0
    joy_timeout_sec: 0.25
