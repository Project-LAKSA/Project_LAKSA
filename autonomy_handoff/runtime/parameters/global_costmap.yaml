/global_costmap/global_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: true
    filters: []
    footprint: '[[-0.15, -0.18], [-0.15, 0.18], [0.42, 0.18], [0.42, -0.18]]'
    footprint_padding: 0.02
    global_frame: map
    height: 5
    inflation_layer:
      cost_scaling_factor: 3.0
      enabled: true
      inflate_around_unknown: false
      inflate_unknown: false
      inflation_radius: 0.55
      plugin: nav2_costmap_2d::InflationLayer
    lethal_cost_threshold: 100
    map_topic: /map
    observation_sources: ''
    obstacle_layer:
      combination_method: 1
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      observation_sources: scan
      plugin: nav2_costmap_2d::ObstacleLayer
      scan:
        clearing: true
        data_type: LaserScan
        expected_update_rate: 0.0
        inf_is_valid: false
        marking: true
        max_obstacle_height: 1.0
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        obstacle_max_range: 8.0
        obstacle_min_range: 0.05
        raytrace_max_range: 10.0
        raytrace_min_range: 0.05
        sensor_frame: ''
        topic: /scan
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - static_layer
    - obstacle_layer
    - zed_voxel_layer
    - inflation_layer
    publish_frequency: 1.0
    resolution: 0.05
    robot_base_frame: laksa_base_footprint
    robot_radius: 0.1
    rolling_window: false
    static_layer:
      enabled: true
      footprint_clearing_enabled: false
      map_subscribe_transient_local: true
      map_topic: ''
      plugin: nav2_costmap_2d::StaticLayer
      subscribe_to_updates: false
      transform_tolerance: 0.0
    track_unknown_space: true
    transform_tolerance: 0.3
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 2.0
    use_maximum: false
    use_sim_time: false
    width: 5
    zed_voxel_layer:
      combination_method: 1
      enabled: true
      footprint_clearing_enabled: true
      mark_threshold: 0
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      observation_sources: zed_cloud
      origin_z: 0.0
      plugin: nav2_costmap_2d::VoxelLayer
      publish_voxel_map: false
      unknown_threshold: 15
      z_resolution: 0.1
      z_voxels: 16
      zed_cloud:
        clearing: true
        data_type: PointCloud2
        expected_update_rate: 0.0
        inf_is_valid: false
        marking: true
        max_obstacle_height: 1.5
        min_obstacle_height: 0.05
        observation_persistence: 0.0
        obstacle_max_range: 4.0
        obstacle_min_range: 0.2
        raytrace_max_range: 5.0
        raytrace_min_range: 0.2
        sensor_frame: ''
        topic: /zed/zed_node/point_cloud/cloud_registered

