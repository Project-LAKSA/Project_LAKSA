/planner_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    GridBased:
      allow_unknown: true
      analytic_expansion_max_length: 5.0
      analytic_expansion_ratio: 3.5
      angle_quantization_bins: 72
      cache_obstacle_heuristic: false
      change_penalty: 0.05
      cost_penalty: 2.5
      downsample_costmap: false
      downsampling_factor: 1
      lookup_table_size: 10.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      minimum_turning_radius: 1.09
      motion_model_for_search: DUBIN
      non_straight_penalty: 1.2
      plugin: nav2_smac_planner/SmacPlannerHybrid
      retrospective_penalty: 0.015
      reverse_penalty: 2.1
      smooth_path: true
      smoother:
        do_refinement: true
        max_iterations: 1000
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      tolerance: 0.25
    expected_planner_frequency: 0.5
    planner_plugins:
    - GridBased
    use_sim_time: false

