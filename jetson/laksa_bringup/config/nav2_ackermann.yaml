controller_server:
  ros__parameters:
    use_sim_time: false
    # Ten hertz leaves enough CPU for SLAM and the planner on the Orin Nano.
    # The previous 20 Hz / 1800 sample combination repeatedly missed its loop.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /laksa/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.12
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.45
    FollowPath:
      # MPPI evaluates complete, collision-checked Ackermann trajectories.
      # Unlike Pure Pursuit, it preserves Reeds-Shepp direction changes so the
      # car can execute planned multi-point forward/reverse maneuvers.
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 48
      model_dt: 0.10
      batch_size: 900
      iteration_count: 1
      vx_std: 0.12
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 0.3621
      # Reverse remains available for deliberate multi-point maneuvers, but
      # runs slower than forward motion for localization and operator safety.
      vx_min: -0.18
      vy_max: 0.0
      wz_max: 0.80
      temperature: 0.30
      gamma: 0.015
      motion_model: Ackermann
      visualize: false
      retry_attempt_limit: 2
      reset_period: 1.0
      prune_distance: 1.5
      transform_tolerance: 0.20
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.12
      inversion_yaw_tolerance: 0.35
      AckermannConstraints:
        # Conservative radius from 0.324 m wheelbase and the measured
        # 16.5-degree right steering limit: 0.324 / tan(16.5 deg) = 1.09 m.
        min_turning_r: 1.09
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.35
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.90
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.35
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 3
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 0.90
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.35
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.00

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      # A rolling local costmap must use the continuous odometry frame. Using
      # map here makes loop-closure corrections jump the costmap away from the
      # laser origin and invalidates every local trajectory at once.
      global_frame: laksa_odom
      robot_base_frame: laksa_base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.15, -0.18], [-0.15, 0.18], [0.42, 0.18], [0.42, -0.18]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: laksa_base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.15, -0.18], [-0.15, 0.18], [0.42, 0.18], [0.42, -0.18]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.2
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      # Reeds-Shepp is the car-like model that supports forward and reverse
      # segments, including explicit cusps for safe direction changes.
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 1.09
      # The car may reverse, but only when the resulting route is materially
      # better. Each cusp requires a real VESC direction-change stop.
      reverse_penalty: 4.0
      change_penalty: 2.0
      non_straight_penalty: 1.35
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      smooth_path: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: laksa_base_footprint
    odom_topic: /laksa/odom
    bt_loop_duration: 20
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names: [controller_server, planner_server, bt_navigator]
