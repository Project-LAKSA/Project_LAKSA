teleop_twist_joy_node:
  ros__parameters:
    # Xbox Series through joy/game_controller_node (SDL mapping).
    # Hold the right bumper while moving the left stick vertically.
    require_enable_button: true
    enable_button: 10
    enable_turbo_button: -1

    axis_linear:
      x: 1
    scale_linear:
      x: 0.20
    scale_linear_turbo:
      x: 0.20

    # First bench test is traction-only. Keep steering centered.
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.0
    scale_angular_turbo:
      yaw: 0.0

