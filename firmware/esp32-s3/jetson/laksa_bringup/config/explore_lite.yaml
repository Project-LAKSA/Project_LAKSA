explore_node:
  ros__parameters:
    robot_base_frame: laksa_base_footprint
    return_to_init: false
    start_paused: true
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    visualize: true
    # Keep a frontier long enough to execute a car-like maneuver. At 0.5 Hz
    # explore_lite continuously preempted Nav2 before the vehicle could turn.
    planner_frequency: 0.10
    progress_timeout: 60.0
    completion_stability_sec: 20.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    min_frontier_size: 0.30
