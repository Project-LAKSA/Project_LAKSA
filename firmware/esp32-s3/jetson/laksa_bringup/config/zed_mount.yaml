# Physical transform from the vehicle navigation frame to the ZED 2i.
#
# Axes follow REP-103:
#   x: forward, y: left, z: up
#   roll: rotation about x, pitch: rotation about y, yaw: rotation about z
#
# Keep configured=false until all six values have been physically measured.
# The 3-D launch file deliberately refuses to start with an uncalibrated mount.
camera_mount:
  configured: true
  parent_frame: laksa_base_footprint
  child_frame: zed_camera_link
  x_m: 0.10807
  y_m: 0.0
  z_m: 0.140
  roll_rad: 0.0
  pitch_rad: 0.0698132
  yaw_rad: 0.0
