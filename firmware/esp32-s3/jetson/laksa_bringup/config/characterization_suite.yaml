schema_version: laksa-digital-twin-characterization-suite-v1
authority: SUPERVISED_LOWER_PRIORITY_THROUGH_DRIVE_SUPERVISOR
operator_entrypoint: /Users/leobardogomez/Documents/repos/Project_LAKSA/laksa-characterize
tests:
  T21_IMU_SANITY:
    depends_on: [t10_forward_pass, t10_reverse_pass, t20_complete]
    physical_action: manual_chassis_rotation_only
    automation: subscriber_recorder_analyzer
    identifies: [imu_yaw_sign, imu_yaw_noise, imu_quantization, imu_dropout]
  T21A:
    depends_on: [t21_imu_sanity_pass, t20_complete]
    physical_action: independently_armed_low_speed_left_or_right_yaw_trial
    automation: supervised_protocol_and_yaw_analyzer
    identifies: [steering_proxy_to_yaw_latency, yaw_rise_time, yaw_gain, left_right_yaw_asymmetry]
  T21B:
    depends_on: [t21a_pass, t22_physical_speed_pass, accepted_trajectory_source]
    physical_action: independently_armed_low_speed_turn
    automation: protocol_and_curvature_analyzer
    identifies: [curvature, turn_radius, steering_to_curvature]
  T22:
    depends_on: [t10_forward_pass, t10_reverse_pass]
    physical_action: measured_distance_start_finish_markers_and_independent_arm
    automation: guided_distance_protocol_and_speed_analyzer
    identifies: [erpm_to_speed, loaded_rolling_radius_proxy, speed_repeatability]
  T23:
    depends_on: [t22_physical_speed_pass]
    physical_action: independently_armed_low_speed_acceleration_and_neutral_coast
    automation: protocol_and_longitudinal_analyzer
    identifies: [acceleration_lag, coastdown_proxy, longitudinal_response]
  T24:
    depends_on: [t22_physical_speed_pass]
    physical_action: independently_armed_low_speed_brake_trial
    automation: protocol_and_braking_analyzer
    identifies: [brake_delay, braking_deceleration]
  T25:
    depends_on: [t20_complete]
    physical_action: zero_traction_static_steering_approach_repeats
    automation: protocol_and_hysteresis_analyzer
    identifies: [steering_proxy_hysteresis, repeatability]
  T26:
    depends_on: [t21b_pass, t22_physical_speed_pass]
    physical_action: compact_independently_armed_multi_speed_turn_set
    automation: protocol_and_slip_trend_analyzer
    identifies: [speed_dependent_yaw_gain, curvature_trend, lateral_slip_trend]
  T27:
    depends_on: [t22_physical_speed_pass]
    physical_action: minimal_independently_armed_multi_level_straight_trials
    automation: protocol_and_drivetrain_map_analyzer
    identifies: [deadband, erpm_speed_monotonicity, saturation, forward_reverse_asymmetry]
  T28:
    depends_on: []
    physical_action: manual_geometry_mass_measurements
    automation: guided_entry_validation
    identifies: [wheelbase, front_track, rear_track, loaded_wheel_radius, mass, cg_longitudinal]
  T29:
    depends_on: [t10_forward_pass, t10_reverse_pass]
    physical_action: opportunistic_during_existing_or_future_trials
    automation: telemetry_analyzer
    identifies: [voltage_sag, current_envelope, vesc_observability]
  T30_SENSOR_MODEL:
    depends_on: []
    physical_action: none
    automation: sensor_observability_and_noise_analyzer
    identifies: [imu_noise, zed_availability, lidar_availability, timestamp_behavior]
  T31:
    depends_on: [t25_repeatability_or_equivalent]
    physical_action: strategic_repeat_trials_only
    automation: robust_repeatability_analyzer
    identifies: [spread, hysteresis, trial_variance]
  T32:
    depends_on: []
    physical_action: optional_surface_label_only
    automation: metadata_support_only
    identifies: [surface_provenance]
  FINAL_TWIN_VALIDATION:
    depends_on: [t22_physical_speed_pass, t21a_pass, accepted_trajectory_source]
    physical_action: held_out_maneuvers
    automation: held_out_prediction_residual_analyzer
    identifies: [held_out_speed_yaw_heading_curvature_timing_residuals]
