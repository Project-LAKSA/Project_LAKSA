/**:
  ros__parameters:
    general:
      # HD720 at 30 Hz leaves deterministic compute margin for RTAB-Map,
      # Nav2, the micro-ROS Agent, and the web dashboard on an 8 GB Orin Nano.
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      # Keep exposure at the 30 Hz capture setting while bounding expensive
      # depth computation and inter-process image traffic on the 8 GB Orin.
      grab_compute_capping_fps: 15.0
      pub_frame_rate: 10.0
      enable_image_validity_check: 1
      # All vehicle sensors must share the ROS system clock. A monotonic
      # offset captured before boot-time NTP correction makes ZED frames
      # impossible to synchronize with LiDAR, VESC, and ESP32 measurements.
      sdk_use_monotonic_clock: false

    video:
      auto_exposure_gain: true
      auto_whitebalance: true
      enable_24bit_output: true
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    depth:
      depth_mode: NEURAL_LIGHT
      depth_stabilization: 30
      min_depth: 0.15
      max_depth: 8.0
      point_cloud_freq: 5.0
      point_cloud_res: REDUCED
      publish_depth_map: true
      publish_point_cloud: true
      voxel_point_cloud: true
      voxel_size_mm: 50.0
      voxel_resolution_mode: STEREO_UNCERTAINTY
      voxel_resolution_scale: 0.2
      remove_saturated_areas: true

    sensors:
      sensors_image_sync: false
      sensors_pub_rate: 100.0
      publish_imu: true
      publish_imu_raw: false
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: true

    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: AUTO
      imu_fusion: true
      map_frame: map
      odometry_frame: laksa_odom
      area_memory: true
      reset_odom_with_loop_closure: false
      set_gravity_as_origin: true
      floor_alignment: false
      two_d_mode: false
      publish_odom_pose: true
      publish_pose_cov: true
      publish_cam_path: false

    # RTAB-Map owns persistent mapping. Enabling the ZED fused map at the same
    # time would duplicate GPU, memory, and map ownership.
    mapping:
      mapping_enabled: false

    object_detection:
      # Object recognition is a separate optional phase. It stays disabled
      # until the mapping/load budget is measured on the complete vehicle.
      od_enabled: false
