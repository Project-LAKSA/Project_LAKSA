schema: 1
contracts:
  frames: [map, odom, base_footprint]
  fused_odom_topic: /laksa/odometry/fused
  wheelbase_m: 0.324
  minimum_turning_radius_m: 1.09
modes:
  LAKSA_MAPPING_MODE:
    map_to_odom_authority: /laksa/fused_mapping/rtabmap
    expected_nodes:
      - {name: /joy_node, package: joy, classification: OFFICIAL}
      - {name: /drive_supervisor, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /laksa_visualization_state_publisher, package: robot_state_publisher, classification: OFFICIAL}
      - {name: /zed/zed_node, package: zed_wrapper, classification: OFFICIAL}
      - {name: /sllidar_node, package: sllidar_ros2, classification: OFFICIAL}
      - {name: /scan_to_scan_filter_chain, package: laser_filters, classification: OFFICIAL}
      - {name: /lidar_watchdog, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /lidar_guard, package: laksa_lidar, classification: REQUIRED_GLUE}
      - {name: /laksa_mapping_state_measurements, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /ekf_filter_node, package: robot_localization, classification: OFFICIAL}
      - {name: /laksa/fused_mapping/rgbd_sync, package: rtabmap_sync, classification: OFFICIAL}
      - {name: /laksa/fused_mapping/rtabmap, package: rtabmap_slam, classification: OFFICIAL}
      - {name: /mapping_session_manager, package: laksa_mapping, classification: REQUIRED_GLUE}
      - {name: /laksa_health_monitor, package: laksa_health, classification: REQUIRED_GLUE}
      - {name: /laksa_mapping_cockpit, package: laksa_dashboard, classification: REQUIRED_GLUE}
      - {name: /laksa_mapping_video, package: web_video_server, classification: OFFICIAL}
    forbidden_nodes: [/map_server, /amcl]
  LAKSA_NAVIGATION_MODE:
    map_to_odom_authority: /amcl
    expected_nodes:
      - {name: /joy_node, package: joy, classification: OFFICIAL}
      - {name: /drive_supervisor, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /laksa_visualization_state_publisher, package: robot_state_publisher, classification: OFFICIAL}
      - {name: /zed/zed_node, package: zed_wrapper, classification: OFFICIAL}
      - {name: /sllidar_node, package: sllidar_ros2, classification: OFFICIAL}
      - {name: /scan_to_scan_filter_chain, package: laser_filters, classification: OFFICIAL}
      - {name: /lidar_watchdog, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /lidar_guard, package: laksa_lidar, classification: REQUIRED_GLUE}
      - {name: /laksa_navigation_state_measurements, package: laksa_bringup, classification: REQUIRED_GLUE}
      - {name: /ekf_filter_node, package: robot_localization, classification: OFFICIAL}
      - {name: /map_server, package: nav2_map_server, classification: OFFICIAL}
      - {name: /amcl, package: nav2_amcl, classification: OFFICIAL}
      - {name: /planner_server, package: nav2_planner, classification: OFFICIAL}
      - {name: /global_costmap/global_costmap, package: nav2_costmap_2d, classification: OFFICIAL}
      - {name: /controller_server, package: nav2_controller, classification: OFFICIAL}
      - {name: /local_costmap/local_costmap, package: nav2_costmap_2d, classification: OFFICIAL}
      - {name: /laksa_saved_navigation_lifecycle_manager, package: nav2_lifecycle_manager, classification: OFFICIAL}
      - {name: /mapping_session_manager, package: laksa_mapping, classification: REQUIRED_GLUE}
      - {name: /laksa_health_monitor, package: laksa_health, classification: REQUIRED_GLUE}
      - {name: /laksa_mapping_cockpit, package: laksa_dashboard, classification: REQUIRED_GLUE}
      - {name: /laksa_mapping_video, package: web_video_server, classification: OFFICIAL}
    forbidden_nodes: [/laksa/fused_mapping/rtabmap, /laksa/fused_mapping/rgbd_sync]
