/laksa_planning_lab/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 1.09
      analytic_expansion_max_length: 5.0
      allow_unknown: false
      tolerance: 0.0
      downsample_costmap: false
      smooth_path: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      cache_obstacle_heuristic: false
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      max_planning_time: 5.0
      lookup_table_size: 20.0
/laksa_planning_lab/smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: /laksa_planning_lab/global_costmap/costmap_raw
    footprint_topic: /laksa_planning_lab/global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    smoother_plugins: [SmoothPath]
    SmoothPath:
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      reversing_enabled: true
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 1.09
      w_curve: 30.0
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 0.015
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5000.0
        fn_tol: 1.0e-15
        param_tol: 1.0e-20
/laksa_planning_lab/global_costmap/global_costmap:
  ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.419, 0.148], [0.419, -0.148], [-0.149, -0.148], [-0.149, 0.148]]"
      plugins: [static_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /laksa_planning_lab/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      always_send_full_costmap: true
