/laksa/fused_mapping/rtabmap:
  ros__parameters:
    use_sim_time: false
    frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    publish_tf: true
    subscribe_rgb: false
    subscribe_depth: false
    subscribe_rgbd: true
    subscribe_scan: true
    subscribe_scan_cloud: false
    subscribe_stereo: false
    subscribe_odom_info: false
    approx_sync: true
    sync_queue_size: 10
    wait_for_transform: 1.0
    qos_image: 2
    qos_camera_info: 2
    qos_odom: 2
    qos_scan: 2
    Mem/IncrementalMemory: 'true'
    Mem/InitWMWithAllNodes: 'false'
    Mem/STMSize: '30'
    Rtabmap/DetectionRate: '1.0'
    Rtabmap/TimeThr: '700'
    # Native visual constraints plus scan ICP. Force3DoF is deliberately not
    # set: ZED roll/pitch/Z and the dense 3-D pose graph remain available.
    Reg/Strategy: '2'
    RGBD/NeighborLinkRefining: 'true'
    RGBD/ProximityBySpace: 'true'
    RGBD/ProximityByTime: 'true'
    RGBD/ProximityPathMaxNeighbors: '10'
    Kp/DetectorStrategy: '6'
    Kp/MaxFeatures: '400'
    Vis/FeatureType: '6'
    Vis/MaxFeatures: '600'
    Vis/MinInliers: '15'
    Vis/EstimationType: '1'
    RGBD/CreateOccupancyGrid: 'true'
    Grid/Sensor: '2'
    Grid/3D: 'true'
    Grid/RayTracing: 'true'
    Grid/CellSize: '0.05'
    Grid/RangeMin: '0.30'
    Grid/RangeMax: '8.0'
    Grid/DepthDecimation: '2'
    Grid/NoiseFilteringRadius: '0.0'
    Grid/NoiseFilteringMinNeighbors: '5'
    Grid/MaxGroundHeight: '0.08'
    Grid/MaxObstacleHeight: '1.50'
    Grid/FootprintLength: '0.57'
    Grid/FootprintWidth: '0.36'
    Grid/FootprintHeight: '0.30'
    cloud_decimation: 4
    cloud_max_depth: 6.0
    cloud_voxel_size: 0.05
    cloud_output_voxelized: true
