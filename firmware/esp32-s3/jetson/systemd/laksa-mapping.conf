[Service]
# Start calibrated ZED/RPLIDAR RTAB-Map fusion at boot. The ZED wrapper runs
# in its independent service and is reused by the mapping launch.
Environment=LAKSA_MAPPING_MODE=3d
Environment=LAKSA_ZED_MOUNT_FILE=/home/ubuntu/laksa_ws/install/laksa_bringup/share/laksa_bringup/config/zed_mount.yaml
